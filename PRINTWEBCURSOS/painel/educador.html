<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel do Educador</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-900 min-h-screen text-white">

  <!-- BARRA FIXA -->
  <header class="sticky top-0 z-50 h-16 flex items-center shadow-md bg-black/50 backdrop-blur">
    <div class="max-w-7xl mx-auto flex justify-between items-center w-full px-4">
      <h1 class="text-2xl font-extrabold tracking-wide flex items-center space-x-2">
        <span class="text-yellow-400 text-3xl">⚡</span>
        <span>PRINTWEBCURSOS</span>
      </h1>
      <nav class="space-x-4">
        <a href="../index.html" class="transition-colors duration-300 text-white hover:text-blue-400 font-medium">Home</a>
        <button onclick="alert('Contato: (81) 98557-0450')" class="transition-colors duration-300 text-white hover:text-blue-400 font-medium">Contato</button>
        <button onclick="abrirEmail()" class="transition-colors duration-300 text-white hover:text-blue-400 font-medium">Empresas</button>
        <a href="cursos.html" class="transition-colors duration-300 text-white hover:text-blue-400 font-medium">Cursos</a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6 space-y-12">
    <div class="text-white">
      <h1 class="text-4xl font-bold mb-2">👩‍🏫 Painel do Educador</h1>
      <p class="text-lg">Gerencie seus cursos, envie vídeos e materiais para os alunos.</p>
    </div>

    <!-- ADICIONAR NOVO CURSO -->
    <section>
      <h2 class="text-2xl font-bold text-green-400 mb-4">➕ Adicionar Novo Curso</h2>
      <div class="glass rounded-xl shadow-lg p-6">
        <form class="space-y-4">
          <input type="text" placeholder="Nome do Curso" class="w-full p-3 rounded-lg bg-gray-700 text-white border border-gray-600 focus:border-green-400 focus:outline-none" />
          <textarea placeholder="Descrição do Curso" class="w-full p-3 rounded-lg bg-gray-700 text-white border border-gray-600 focus:border-green-400 focus:outline-none"></textarea>
          <button type="submit" class="bg-green-400 hover:bg-green-500 text-gray-900 font-bold py-3 px-6 rounded-lg transition w-full">Criar Curso</button>
        </form>
      </div>
    </section>

    <!-- UPLOAD DE VÍDEOS -->
    <section>
      <h2 class="text-2xl font-bold text-green-400 mb-4">🎥 Upload de Vídeo para Curso</h2>
      <div class="glass rounded-xl shadow-lg p-6">
        <form class="space-y-4">
          <select class="w-full p-3 rounded-lg bg-gray-700 text-white border border-gray-600 focus:border-green-400 focus:outline-none">
            <option value="">Selecione o Curso</option>
            <option value="sql">SQL Avançado</option>
            <option value="ia">Inteligência Artificial</option>
            <option value="php">PHP do Zero</option>
          </select>
          <input type="file" accept="video/*" class="w-full p-3 rounded-lg bg-gray-700 text-white border border-gray-600 focus:border-green-400 focus:outline-none" />
          <button type="submit" class="bg-green-400 hover:bg-green-500 text-gray-900 font-bold py-3 px-6 rounded-lg transition w-full">Enviar Vídeo</button>
        </form>
      </div>
    </section>

    <!-- UPLOAD DE MATERIAIS DE APOIO -->
    <section>
      <h2 class="text-2xl font-bold text-green-400 mb-4">📄 Upload de Material de Apoio</h2>
      <div class="glass rounded-xl shadow-lg p-6">
        <form class="space-y-4">
          <select class="w-full p-3 rounded-lg bg-gray-700 text-white border border-gray-600 focus:border-green-400 focus:outline-none">
            <option value="">Selecione o Curso</option>
            <option value="sql">SQL Avançado</option>
            <option value="ia">Inteligência Artificial</option>
            <option value="php">PHP do Zero</option>
          </select>
          <input type="file" accept="application/pdf" class="w-full p-3 rounded-lg bg-gray-700 text-white border border-gray-600 focus:border-green-400 focus:outline-none" />
          <button type="submit" class="bg-green-400 hover:bg-green-500 text-gray-900 font-bold py-3 px-6 rounded-lg transition w-full">Enviar PDF</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    function abrirEmail() {
      const assunto = prompt("Assunto do email:");
      const corpo = prompt("Escreva sua mensagem:");
      if (assunto && corpo) {
        const mailto = `mailto:ellenbaronebea@gmail.com?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
        window.location.href = mailto;
      }
    }
  </script>

</body>
</html>
